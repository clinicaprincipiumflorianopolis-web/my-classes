<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Painel de Alunos</title>
<meta name="theme-color" content="#12A594" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  html, body { margin: 0; padding: 0; background: #F7F8FA; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React / ReactDOM carregados localmente (não depende de internet externa) -->
<script src="react.production.min.js"></script>
<script src="react-dom.production.min.js"></script>

<script>
  // Shim simples de armazenamento local, com a mesma "cara" da API usada no Claude (window.storage)
  window.storage = {
    async get(key, _raw) {
      try {
        const v = localStorage.getItem(key);
        return v !== null ? { value: v } : null;
      } catch (e) {
        return null;
      }
    },
    async set(key, value, _raw) {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (e) {
        console.error("Erro ao salvar dados", e);
        return false;
      }
    }
  };
</script>

<script src="app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => {
        console.error("Falha ao registrar service worker", err);
      });
    });
  }
</script>
</body>
</html>
